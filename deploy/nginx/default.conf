# 配置加载在 Nginx 的 http 块中，按请求类型决定是否升级连接。
map $http_upgrade $seekf_connection_upgrade {
    default upgrade;
    ''      '';
}

# Nginx 需加入自定义 Docker 网络；使用内置 DNS，仅解析 IPv4。
resolver 127.0.0.11 valid=30s ipv6=off;
resolver_timeout 3s;

upstream seekf_user {
    zone seekf_user 64k;
    server host.docker.internal:3000 resolve;
    keepalive 32;
}

upstream seekf_backend {
    zone seekf_backend 64k;
    server host.docker.internal:8080 resolve;
    keepalive 32;
}

upstream seekf_admin {
    zone seekf_admin 64k;
    server host.docker.internal:3002 resolve;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name localhost;

    # 包含表单额外开销；实际图片和视频限制仍由后端校验。
    client_max_body_size 512m;
    client_body_timeout 600s;
    # 本地开发首屏并发较多，避免跨 Docker Desktop 建连时过早超时。
    proxy_connect_timeout 30s;

    location = /admin {
        return 308 /admin/;
    }

    # 保留 /admin/ 前缀，与 Vite base 和 React Router basename 一致。
    location /admin/ {
        proxy_pass http://seekf_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $seekf_connection_upgrade;
        proxy_read_timeout 1200s;
    }

    location = /api {
        return 308 /api/;
    }

    # Nuxt Icon 也使用 /api/，此接口属于前端，保留完整路径转发。
    location /api/_nuxt_icon/ {
        proxy_pass http://seekf_user;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 末尾的 / 用于去掉 /api/ 前缀，后端仍收到 /user/...。
    location /api/ {
        proxy_pass http://seekf_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $seekf_connection_upgrade;

        # AI 回答逐段转发，上传不先缓冲完整文件；断开请求时沿用默认取消行为。
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1200s;
        proxy_send_timeout 600s;

        # 保留视频拖动所需的字节范围条件，响应状态及范围头由后端返回。
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # 用户页面转发到宿主机 3000 端口，兼容本地开发及 Docker 运行。
    location / {
        proxy_pass http://seekf_user;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 本地 nuxt dev 的热更新也通过此入口建立 WebSocket 连接。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $seekf_connection_upgrade;
        proxy_read_timeout 1200s;
    }
}
